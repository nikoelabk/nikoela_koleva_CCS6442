services:
  app:
    build: .
    restart: on-failure
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  checkstatus:
    build:
      context: ./src
      dockerfile: Production-Dockerfile
    platform: linux/amd64
    depends_on:
      - postgres